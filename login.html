<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - SouthAsianPulse</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="page-wrapper">
            <header>
                <a href="index.html" class="logo">SouthAsianPulse</a>
                <nav>
                    <a href="index.html">Home</a>
                    <a href="announcement.html">Announcement</a>
                    <a href="plannar.html">My plannar</a>
                    <a href="login.html" class="btn active">Login</a>
                </nav>
            </header>

            <main class="container">
                <section class="login-container">
                    <div class="login-card">
                        <h1>Campus Portal Login</h1>
                        <p class="tagline">
                            Sign in with your official university credentials to access verified role views and resources.
                        </p>
                        
                        <form class="login-form">
                            <div class="form-group">
                                <label for="email">Student / Faculty Email</label>
                                <input type="email" id="email" placeholder="username@sau.edu.in" required>
                            </div>

                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" placeholder="Enter your password" required>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn login-submit-btn">Sign In</button>
                            </div>
                        </form>
                    </div>
                </section>
            </main>

            <footer>
                <p>&copy; 2026 SouthAsianPulse - Fundamentals of Web Development Project.</p>
            </footer>
        </div>
    </body>
</html>
